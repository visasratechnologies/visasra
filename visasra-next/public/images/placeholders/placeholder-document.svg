<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="docAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#docBg)" />
  <g transform="translate(135, 95)">
    <!-- Document Card -->
    <rect x="0" y="0" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    <!-- Top badge banner -->
    <rect x="15" y="18" width="50" height="12" rx="4" fill="url(#docAccent)" />
    <!-- Chip or photo placeholder on doc -->
    <rect x="15" y="42" width="36" height="44" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="33" cy="56" r="8" fill="#94A3B8" />
    <path d="M21 78 C21 68, 45 68, 45 78" fill="#94A3B8" />
    <!-- Lines of doc text -->
    <rect x="62" y="44" width="52" height="8" rx="3" fill="#E2E8F0" />
    <rect x="62" y="58" width="40" height="6" rx="3" fill="#E2E8F0" />
    <rect x="62" y="70" width="46" height="6" rx="3" fill="#E2E8F0" />
    <rect x="15" y="100" width="100" height="6" rx="3" fill="#E2E8F0" />
    <rect x="15" y="114" width="70" height="6" rx="3" fill="#E2E8F0" />
    <!-- Checkmark badge -->
    <circle cx="106" cy="130" r="14" fill="#10B981" />
    <path d="M100 130 L104 134 L112 125" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="200" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Verification Document</text>
  <text x="200" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Identity card proof / pending verification</text>
</svg>
