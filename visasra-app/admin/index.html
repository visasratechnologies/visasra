<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123A69">
<title>Visasra Admin</title><link rel="icon" href="logo.png">
<style>
:root{--fd:'Fraunces',Georgia,serif;--fu:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--bg:#EAF2FC;--bd:#D6E3F3;--tx:#092B55;--dim:#4C6180;--faint:#8B9CB5;--bl:#1261B5;--nv:#123A69;--ok:#2E9E27;--bad:#E51D2A;--wn:#E07B00}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 var(--fu);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
h2{margin:0;font-size:24px}.mut{color:var(--dim)}.sm{font-size:12.5px}.b{font-weight:700}.r{text-align:right}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#123A69,#092B55);color:#CFE0F5;padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800;font-size:21px;padding:2px 8px 16px}.brand img{width:40px}.brand small{display:block;font-size:10px;letter-spacing:.14em;color:#8DB6E6}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;padding:10px 12px;border-radius:10px;font-weight:600;text-align:left}
.nv:hover{background:rgba(255,255,255,.08)}.nv.on{background:#fff;color:var(--nv)}.nv b{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7F9CC4;padding:14px 12px 4px;font-weight:700}
.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top h1{font-size:20px;margin:0;flex:1}.top img{width:30px;display:none}
.page{padding:22px 24px 48px;max-width:1300px}
.ph2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.ph2 p{margin:4px 0 0;color:var(--dim)}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 1px 2px rgba(9,43,85,.06)}.pad{padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:1.5fr 1fr}
.kpi{padding:14px 16px;border-top:4px solid var(--c,var(--bl));cursor:pointer}.kpi .l{font-size:12.5px;font-weight:700;color:var(--dim)}.kpi .v{font-size:26px;font-weight:800;margin:2px 0}.kpi .s{font-size:12px;color:var(--faint)}
.btn{border:0;border-radius:10px;padding:9px 15px;font-weight:700;background:var(--bl);color:#fff;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.g{background:var(--ok)}.btn.d{background:var(--bad)}.btn.o{background:#fff;color:var(--bl);border:1.5px solid var(--bl)}.btn.x{background:#fff;color:var(--dim);border:1.5px solid var(--bd)}.btn.s{padding:6px 11px;font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:#E3EEFB;color:var(--bl);white-space:nowrap}
.pill.g{background:#E7F5E5;color:var(--ok)}.pill.o{background:#FFF1E0;color:var(--wn)}.pill.r{background:#FCE7E8;color:var(--bad)}.pill.n{background:#EDF1F6;color:#5B6B82}.pill.p{background:#F9E6F2;color:#D6288F}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1.5px solid var(--bd);background:#fff;border-radius:99px;padding:6px 13px;font-weight:700;font-size:12.5px;color:var(--dim)}.chip.on{background:var(--nv);border-color:var(--nv);color:#fff}
.inp{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:9px 12px;background:#fff;outline:none}.inp:focus{border-color:var(--bl)}
.tool{margin-bottom:12px;max-width:340px}
table.t{width:100%;border-collapse:collapse}.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:11px 14px;background:#F7FAFE;border-bottom:1px solid var(--bd);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid #E6EEF8}.t tr:last-child td{border:0}.t tbody tr{cursor:pointer}.t tbody tr:hover{background:#F4F9FF}
.av{width:36px;height:36px;border-radius:50%;background:#E8F0FA;display:inline-grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.who{display:flex;gap:10px;align-items:center}.who small{display:block;color:var(--faint)}
.task{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #E6EEF8;cursor:pointer}.task:first-child{border-top:0}.task:hover{background:#F6FAFE}
.empty{text-align:center;padding:34px 16px;color:var(--dim)}.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:0}.kv dt{color:var(--dim);font-weight:600}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.note{border-radius:12px;padding:11px 14px;background:#E3EEFB;margin-bottom:14px}.note.w{background:#FFF1E0}.note.bad{background:#FCE7E8}.note.ok{background:#E7F5E5}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.docs img{width:100%;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in}
.qr{width:130px;height:130px;object-fit:contain;border:1px solid var(--bd);border-radius:10px;background:#fff;cursor:zoom-in;flex:none}
#ov{position:fixed;inset:0;z-index:50;display:none}#ov.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(9,28,56,.5)}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:-18px 0 40px -18px rgba(0,0,0,.4)}
.pt{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--bd)}.pt b{font-size:17px}
.pb{flex:1;overflow-y:auto;padding:16px 18px}.pf{display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-top:1px solid var(--bd)}
.sec{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
.pick{display:flex;gap:10px;align-items:center;padding:10px;border:1.5px solid #E6EEF8;border-radius:12px;margin-bottom:8px;background:#fff;cursor:pointer}.pick:hover{border-color:var(--bl)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#092B55;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;z-index:90;opacity:0;visibility:hidden;transition:.2s;max-width:92%}#toast.on{opacity:1;visibility:visible}
.bn{display:none}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login form{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:28px;width:min(400px,100%)}.login img{width:70px;display:block;margin:0 auto 10px}
.field{margin-bottom:12px}.field label{display:block;font-weight:700;font-size:12.5px;color:var(--dim);margin-bottom:5px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:860px){
.shell{display:block}.side{display:none}.top{padding:0 14px;height:54px}.top img{display:block}.top h1{font-size:18px}.page{padding:14px 14px 100px}
.bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bn button{border:0;background:none;font-size:11px;font-weight:700;color:var(--faint);padding:8px 0;position:relative}.bn button.on{color:var(--nv)}.bn button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:3px;background:var(--nv)}
.bn b{position:absolute;top:2px;left:55%;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.g4{gap:10px}.kpi .v{font-size:21px}
.t thead{display:none}.t,.t tbody,.t tr,.t td{display:block;width:100%}.card:has(table.t){background:none;border:0;box-shadow:none}
.t tr{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:9px}.t td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:10px;text-align:right}
.t td::before{content:attr(data-l);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--faint);flex:none}.t td.f{display:block;text-align:left;border-bottom:1px solid #E6EEF8;padding-bottom:7px;margin-bottom:3px}.t td.f::before{display:none}
.panel{top:auto;width:100%;max-height:92%;border-radius:20px 20px 0 0}.docs{grid-template-columns:1fr}.docs img{height:170px}.kv{grid-template-columns:100px 1fr}#toast{bottom:80px}
}
/* ---- match customer + worker apps ---- */
h1,h2,h3,.serif{font-family:var(--fd);font-weight:700;letter-spacing:-.01em}
.side{background:linear-gradient(180deg,#0C3270 0%,#0A2A5E 55%,#071F48 100%);box-shadow:4px 0 24px -12px rgba(7,31,72,.55);padding:24px 16px 20px;gap:4px}
.brand{font-family:var(--fu);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px 22px;gap:10px}.brand img{width:46px;height:auto}
.brand small{font-size:10px;font-weight:700;letter-spacing:.2em;color:#8FC0FF;margin-top:2px}
.nv{font-size:13.5px;padding:12px 14px;gap:13px;color:rgba(255,255,255,.86);transition:background .14s,color .14s,box-shadow .14s}
.nv:hover{background:rgba(255,255,255,.09);color:#fff}
.nv.on,.nv.on:hover{background:linear-gradient(90deg,#1668D9,#2A86F5);color:#fff;box-shadow:0 6px 16px -6px rgba(42,134,245,.75)}
.grp{color:#8FB1DC}
.top{background:#fff}.top h1{font-size:21px}
.wm{font-family:var(--fd);font-weight:800;font-size:23px;letter-spacing:-.3px;color:#fff;display:none}.wm b{color:#8FC2FF;font-weight:800}
.kpi .v,.money{font-family:var(--fu);font-weight:800}
.btn{border-radius:12px;font-weight:800;box-shadow:0 6px 14px -8px rgba(18,97,181,.7)}
.btn.o,.btn.x,.btn.s{box-shadow:none}.btn.g{box-shadow:0 6px 14px -8px rgba(54,168,45,.7)}.btn.d{box-shadow:0 6px 14px -8px rgba(229,29,42,.6)}
.btn.g{background:#36A82D}
.pill{padding:5px 11px;background:#DCEAFB;border-radius:999px}
.pill.g{color:#228A1B}.pill.o{color:#C26A00}
.card{box-shadow:0 1px 2px rgba(9,43,85,.06),0 1px 1px rgba(9,43,85,.05)}
.av{background:#123A69;color:#fff}
.chip.on{background:var(--nv)}
.login{background:#EAF2FC}.login form{box-shadow:0 10px 26px -14px rgba(9,43,85,.24),0 2px 6px rgba(9,43,85,.06)}
.login .wm{display:block;color:var(--tx);text-align:center;font-size:28px;margin-bottom:6px}.login .wm b{color:var(--bl)}
.login img{width:78px}
.bn .ic{display:none}
@media(max-width:860px){
.top{background:linear-gradient(180deg,#0F3567 0%,#164A8A 55%,#2266B5 100%);border-bottom:0;box-shadow:0 2px 8px rgba(15,53,103,.18);height:auto;min-height:58px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 10px;gap:10px}
.top img{width:34px}.top h1{color:#fff;font-size:21px}
.bn{background:rgba(255,255,255,.96);border-top:2px solid var(--nv);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.bn button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;padding:0}
.bn button.on::before{display:none}.bn button.on{color:var(--tx)}
.bn .ic{display:grid;width:36px;height:36px;border-radius:50%;background:#DCEAFB;place-items:center;color:var(--bl)}
.bn .ic svg{width:19px;height:19px}
.bn button.on .ic{background:var(--nv);color:#fff}
.bn b{left:auto;right:calc(50% - 26px);top:0}
}

/* ================= v6 design pass ================= */
:root{--bg:#E3ECF7;--bd:#CBDBEE;--bl:#1B5AA6;--nv:#123A69;--ok:#2F7D4A;--bad:#B3261E}
body{background:var(--bg)}
/* sidebar: tighter, hidden scrollbar */
.side{scrollbar-width:none;-ms-overflow-style:none;padding:18px 14px 14px;gap:2px}
.side::-webkit-scrollbar{display:none}
.brand{padding:0 6px 14px}
.nv{padding:9px 13px;font-size:13.5px}
.grp{padding:12px 13px 4px}
/* top bar: breadcrumb + user, no repeated title */
.top{height:54px;padding:0 28px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px)}
.top img,.top .wmk{display:none}
.crumb{font-size:13px;color:var(--dim);font-weight:600;display:flex;gap:8px;align-items:center}.crumb i{font-style:normal;color:var(--faint)}.crumb b{color:var(--tx);font-weight:800}
.usr{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px}.usr .av{width:30px;height:30px;font-size:11px}
/* page banner */
.ph2{position:relative;overflow:hidden;background:linear-gradient(120deg,#123A69 0%,#1B5AA6 100%);color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:18px;align-items:center;box-shadow:0 14px 28px -18px rgba(18,58,105,.7)}
.ph2::after{content:"";position:absolute;right:-60px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(143,192,255,.28),transparent 70%);pointer-events:none}
.ph2 h2{color:#fff;font-size:26px}.ph2 p{color:#C7DCF5;margin:5px 0 0;max-width:620px}
.ph2 .row{position:relative;z-index:1}
.ph2 .btn,.ph2 .btn.o,.ph2 .btn.x{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.32)}
.ph2 .btn:hover{background:rgba(255,255,255,.24)}
.ph2 .btn:not(.o):not(.x){background:#fff;color:var(--nv);border-color:#fff}
/* buttons: calm, flat, no glow */
.btn{border-radius:10px;font-weight:700;font-size:13.5px;padding:9px 16px;background:var(--bl);color:#fff;border:1px solid transparent;box-shadow:none;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:#154A8A}
.btn.o{background:#fff;color:var(--bl);border:1px solid #9DBBE0}.btn.o:hover{background:#EEF4FC}
.btn.x{background:#fff;color:var(--dim);border:1px solid var(--bd)}.btn.x:hover{background:#F3F7FC;color:var(--tx)}
.btn.g{background:var(--ok);color:#fff;box-shadow:none}.btn.g:hover{background:#266A3E}
.btn.d{background:#FBEDEE;color:var(--bad);border:1px solid #F0C9CC;box-shadow:none}.btn.d:hover{background:#F7DDE0}
.btn.s{padding:6px 12px;font-size:12.5px}
/* pills: soft tints */
.pill{font-weight:700;padding:4px 11px}
.pill.g{background:#E3F1E7;color:#256B3E}.pill.o{background:#FCEFD9;color:#9A5B00}.pill.r{background:#F8E1E3;color:#A32019}.pill.p{background:#F5E4EF;color:#A8206F}
/* cards: tinted, with depth */
.card{border-color:var(--bd);box-shadow:0 6px 18px -10px rgba(9,43,85,.22)}
.kpi{position:relative;padding:16px 16px 14px 16px;border-top:0;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#1B5AA6) 13%,#fff) 0%,#fff 72%);border-color:color-mix(in srgb,var(--c,#1B5AA6) 22%,#CBDBEE);transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(9,43,85,.3)}
.kpi .ki{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--c,#1B5AA6);color:#fff}
.kpi .ki svg{width:19px;height:19px}
.kpi .l{padding-right:46px;color:color-mix(in srgb,var(--c,#1B5AA6) 55%,#2B4569)}
.kpi .v{font-size:28px;color:var(--tx);margin:6px 0 2px}
.kpi[style*="cursor:default"]:hover{transform:none}
/* tables */
.t th{background:#E8F0FA;color:#35567F;border-bottom:1px solid var(--bd)}
.t td{border-bottom:1px solid #E3ECF7}.t tbody tr:hover{background:#EEF5FD}
/* list/task rows, panels */
.task:hover{background:#EEF5FD}
.pt{background:linear-gradient(120deg,#123A69,#1B5AA6);color:#fff;border-bottom:0}.pt .mut,.pt .sm{color:#C7DCF5}.pt .btn.x{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.sec{color:#35567F;border-bottom:1px solid var(--bd);padding-bottom:6px}
.note{border:1px solid rgba(27,90,166,.15)}.note.w{border-color:#F2D9A8}.note.bad{border-color:#F0C9CC}.note.ok{border-color:#BFE0C8}
.chip{background:#fff}.chip.on{background:var(--nv)}
.inp{border-color:var(--bd)}
@media(max-width:860px){
.top{background:linear-gradient(180deg,#0F3567 0%,#164A8A 55%,#2266B5 100%)}
.top img{display:block}.top .wmk{display:inline;font-family:var(--fd);font-weight:800;font-size:23px;letter-spacing:-.3px;color:#fff}.top .wmk b{color:#8FC2FF}
.crumb,.usr span:last-child{display:none}.usr .av{background:#DCEAFB;color:var(--nv)}
.ph2{padding:16px 18px;border-radius:16px;margin-bottom:14px}.ph2 h2{font-size:22px}
.kpi .v{font-size:23px}.kpi .ki{width:30px;height:30px;right:10px;top:10px}.kpi .ki svg{width:16px;height:16px}.kpi .l{padding-right:34px}
}

/* weekly activity card */
.wk{display:grid;grid-template-columns:1fr 230px;overflow:hidden;background:#fff}
.wk-main{padding:20px 22px 12px;min-width:0}
.wk-svg{width:100%;height:auto;display:block;overflow:visible}
.wk-svg .ax{font-size:11px;fill:#7C93B0;font-weight:600}.wk-svg .dw{font-size:12px;fill:#5B7396;font-weight:700}.wk-svg .dd{font-size:11px;fill:#9AAEC7;font-weight:600}
.wk-svg .vl{font-size:13px;font-weight:800;fill:#35567F}.wk-svg .td{fill:#123A69}
.dl{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}.dl.up{background:#E3F1E7;color:#256B3E}.dl.dn{background:#F8E1E3;color:#A32019}
.wk-side{background:linear-gradient(160deg,#123A69,#1B5AA6);color:#fff;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.ws{padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.18)}.ws:last-child{border:0;padding:0}
.ws span{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#A9C6EA}
.ws b{display:block;font-size:26px;font-weight:800;margin-top:3px}.ws small{color:#C7DCF5;font-size:12px}
@media(max-width:860px){.wk{grid-template-columns:1fr}.wk-main{padding:16px 12px 6px}.wk-side{flex-direction:row;flex-wrap:wrap;gap:0;padding:14px 16px}.ws{flex:1 1 90px;padding:0 10px 0 0;border:0}.ws b{font-size:19px}.wk-svg .vl{font-size:15px}.wk-svg .dw,.wk-svg .ax{font-size:13px}}

@media(min-width:861px) and (max-height:760px){.side{padding:12px 12px 10px}.brand{padding:0 6px 8px}.brand img{width:38px}.nv{padding:6px 12px;font-size:13px}.grp{padding:8px 12px 2px;font-size:10px}.side .nv svg{width:16px;height:16px}}
@media(min-width:861px) and (max-height:600px){.nv{padding:4px 12px}.grp{padding:5px 12px 0}.brand small{display:none}}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:60px;height:60px;border-radius:9px;object-fit:cover;border:1px solid var(--bd);cursor:zoom-in;background:#fff}

.pc{margin-bottom:12px}.pch{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.pcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.pcg:has(.big){grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pcf{margin:0;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff}.pcf img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in;background:#F1F6FC}
.pcf figcaption{padding:6px 8px;font-size:12.5px;font-weight:700}.pcf figcaption small{display:block;font-weight:500;color:var(--dim);font-size:11.5px;margin-top:2px}
.pcf.o-approved{border:2px solid #2F7D4A}.pcf.o-rejected img,.pcf.o-not_chosen img{opacity:.55}.pcf.big img{aspect-ratio:4/3}
